name: Compilar CreaApps Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Encontrar proyecto completo o extraer ZIP
        shell: bash
        run: |
          set -e
          PROJECT_DIR="."
          if [ ! -f "$PROJECT_DIR/src/main.js" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            mkdir -p /tmp/creaapps-source
            ZIP="$(find . -maxdepth 4 -type f -iname '*.zip' -not -path './node_modules/*' -print -quit)"
            if [ -z "$ZIP" ]; then
              echo 'ERROR: No se encontro un proyecto completo ni un ZIP. Sube CreaApps-Nativo-Android.zip al repositorio.'
              exit 1
            fi
            unzip -oq "$ZIP" -d /tmp/creaapps-source
            PROJECT_DIR="$(find /tmp/creaapps-source -type f -path '*/src/main.js' -not -path '*/node_modules/*' -print -quit | xargs -r dirname | xargs -r dirname)"
            if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
              echo 'ERROR: El ZIP no contiene package.json y src/main.js en el proyecto.'
              exit 1
            fi
          fi
          echo "Proyecto seleccionado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar dependencias y compilar web
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          npm install
          npm run build

      - name: Preparar proyecto Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generar APK de prueba
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generar paquete AAB
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew bundleRelease

      - name: Guardar APK y AAB
        uses: actions/upload-artifact@v4
        with:
          name: CreaApps-Android-Nativo
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
